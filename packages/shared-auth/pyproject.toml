[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-auth"
version = "1.0.1"
requires-python = ">=3.12"
dependencies = [
    "PyJWT==2.15.1",
    "cryptography==50.0.2",
]

[project.optional-dependencies]
drf = [
    "djangorestframework==3.18.3",
]

[tool.setuptools]
packages = ["shared_auth"]
